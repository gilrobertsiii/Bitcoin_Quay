[package]
name = "quay"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Dual control, evidence, and an integration allowlist for a BLVM node"
repository = "https://github.com/gilrobertsiii/Bitcoin_Quay"
publish = false

[[bin]]
name = "quay"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
